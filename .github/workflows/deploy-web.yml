name: Deploy Web UI

on:
  push:
    branches: [main]
    paths:
      - 'web-ui/**'
      - 'packages/agent-client/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build -w qa-web-ui

      - name: Deploy to qa.piemnaya.ru
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "DEPLOY_* secrets not set — skip remote deploy (build artifact only)"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            web-ui/dist/ "${SSH_USER}@${SSH_HOST}:/var/www/qa-browser/"
