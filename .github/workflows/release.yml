name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm exec -w qa-desktop-agent -- playwright install chromium

      - name: Build macOS installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac -w qa-desktop-agent

      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: desktop-agent/release/*
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm exec -w qa-desktop-agent -- playwright install chromium

      - name: Build Windows installer
        run: npm run package:win -w qa-desktop-agent

      - uses: actions/upload-artifact@v4
        with:
          name: win-installers
          path: desktop-agent/release/*
          if-no-files-found: error

  github-release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
