appId: com.magnific.qa-desktop-agent
productName: Magnific QA Desktop Agent
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
copyright: Copyright © QA Team

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true
asarUnpack:
  - "**/*.node"

extraResources:
  - from: build/INSTALL-MAC.txt
    to: INSTALL-MAC.txt
  - from: build/playwright-browsers
    to: playwright-browsers
    filter:
      - "**/*"
  - from: build/icon.png
    to: tray-icon.png

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Ad-hoc sign — reduces "app is damaged" after download (still run xattr -cr once)
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    LSMinimumSystemVersion: '10.15.0'
  target:
    - target: zip
      arch:
        - arm64
        - x64

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
  shortcutName: QA Desktop Agent

publish: null
