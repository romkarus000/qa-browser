# Copy to /etc/nginx/sites-available/qa-browser on the server
# ln -s .../qa-browser /etc/nginx/sites-enabled/

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qa.piemnaya.ru;

    ssl_certificate /etc/letsencrypt/live/qa.piemnaya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa.piemnaya.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/qa-browser;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /profiles.json {
        add_header Cache-Control "no-cache";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name qa.piemnaya.ru;
    return 301 https://$host$request_uri;
}
